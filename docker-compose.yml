services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ordermatchingengine
      POSTGRES_USER: ordermatchingengine
      POSTGRES_PASSWORD: ordermatchingengine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordermatchingengine -d ordermatchingengine"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ordermatchingengine
      SPRING_DATASOURCE_USERNAME: ordermatchingengine
      SPRING_DATASOURCE_PASSWORD: ordermatchingengine
    ports:
      - "8080:8080"

volumes:
  postgres-data:
