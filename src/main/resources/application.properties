spring.application.name=ordermatchingengine

# PREVIOUS: spring.datasource.url=jdbc:postgresql://localhost:5432/ordermatchingengine
# reWriteBatchedInserts lets the Postgres driver send a batch of INSERTs as one multi-row statement
spring.datasource.url=jdbc:postgresql://localhost:5432/ordermatchingengine?reWriteBatchedInserts=true
spring.datasource.username=ordermatchingengine
spring.datasource.password=ordermatchingengine

spring.jpa.hibernate.ddl-auto=update
# PREVIOUS: spring.jpa.show-sql=true
# (printing every INSERT to the console was the top lock-contention site in JFR)
spring.jpa.show-sql=false

# Batch trade inserts (OrderBookService.flushTrades -> saveAll)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Two scheduler threads so trade flushing and the depth feed don't block each other
spring.task.scheduling.pool.size=2
